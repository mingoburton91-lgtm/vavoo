plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mingoburton.chatgptauto'
    compileSdk 35

    defaultConfig {
        applicationId "com.mingoburton.chatgptauto"
        minSdk 28
        targetSdk 35
        versionCode 2
        versionName "1.2"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation "androidx.car.app:app:1.7.0"
    implementation "androidx.car.app:app-projected:1.7.0"
}
