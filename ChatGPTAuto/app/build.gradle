plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mingoburton.chatgptauto'
    compileSdk 35

    defaultConfig {
        applicationId "com.mingoburton.chatgptauto"
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
